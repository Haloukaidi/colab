name: Prepare RefCOCO text data
on:
  workflow_dispatch:
  push:
    paths:
      - 'efficientsam3-lite50/scripts/prepare_refcoco_text.py'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tokenizer and data dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pyarrow==19.0.1' 'pycocotools==2.0.10' ftfy regex iopath
      - name: Download public annotations and prepare text-only splits
        run: python efficientsam3-lite50/scripts/prepare_refcoco_text.py --output release_refcoco
      - name: Preserve source snapshot and offline audit dependencies
        run: |
          cp -r efficientsam3-lite50 release_refcoco/code_snapshot
          mkdir -p release_refcoco/audit_wheels
          python -m pip download --only-binary=:all: --no-deps --python-version 313 --dest release_refcoco/audit_wheels pyarrow==19.0.1 pycocotools==2.0.10 ftfy regex portalocker tqdm wcwidth
          python -m pip wheel --no-deps --wheel-dir release_refcoco/audit_wheels iopath
      - uses: actions/upload-artifact@v4
        with:
          name: refcoco-text-data-and-audit
          path: release_refcoco/
          retention-days: 14
          if-no-files-found: error
